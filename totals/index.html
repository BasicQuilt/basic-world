<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Golem — Total Donations</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0a08; --surface: #151512; --border:  #2b2a24;
      --border2: #423f34; --text:    #e6e2d3; --muted:   #85806e;
      --accent:  #f2c31c; --success: #22c97a; --warn:    #f5a623;
      --mono:    'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: flex-start;
      justify-content: center; padding: 24px 16px 48px;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(242,195,28,.05) 0, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(242,195,28,.04) 0, transparent 45%),
        linear-gradient(rgba(242,195,28,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242,195,28,.035) 1px, transparent 1px);
      background-size: auto, auto, 40px 40px, 40px 40px;
    }
    .wrap { position:relative; z-index:1; width:100%; max-width:440px; }
    .header { text-align:center; padding:32px 0 24px; }
    .header h1 {
      font-family:var(--mono); font-size:19px; font-weight:700; color:#fff;
      letter-spacing:1px; text-transform:uppercase;
    }
    .header p  { font-size:13px; color:var(--muted); margin-top:4px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:12px; }
    .card-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
    .card-title  { font-family:var(--mono); font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .refresh-btn {
      background:none; border:1px solid var(--border2); color:var(--muted);
      font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:8px;
      cursor:pointer; transition:all .15s;
    }
    .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
    .refresh-btn:disabled { opacity:.5; cursor:default; }
    .stat-card { padding:26px 18px; text-align:center; }
    .stat-total {
      font-family:var(--mono); font-weight:700; font-size:36px; color:var(--accent);
      line-height:1.1; word-break:break-word;
    }
    .stat-total .unit { font-size:16px; color:var(--muted); margin-left:6px; }
    .stat-sub { font-size:13px; color:var(--muted); margin-top:8px; }
    .status-box { padding:14px 18px; border-radius:12px; border:1px solid; font-size:13px; margin-bottom:12px; line-height:1.6; }
    .status-info  { background:rgba(242,195,28,.08); border-color:rgba(242,195,28,.3); color:var(--accent); }
    .status-error { background:rgba(255,80,80,.08);  border-color:rgba(255,80,80,.3);  color:#ff8080; }
    .list { max-height:420px; overflow-y:auto; }
    .donation-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 18px; border-bottom:1px solid var(--border); font-size:13px;
    }
    .donation-row:last-child { border-bottom:none; }
    .donation-row .amount { font-family:var(--mono); font-weight:700; color:#fff; font-size:14px; }
    .donation-row .amount .unit { color:var(--muted); font-weight:400; font-size:11px; margin-left:4px; }
    .donation-row .time { color:var(--muted); font-size:11px; font-family:var(--mono); }
    .empty-state { text-align:center; padding:36px 18px; color:var(--muted); font-size:13px; line-height:1.6; }
    .back-link { display:block; text-align:center; font-size:12px; color:var(--muted); margin-top:8px; text-decoration:none; }
    .back-link:hover { color:var(--accent); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Mr. Golem</h1>
    <p>Total donations raised</p>
  </div>

  <div id="status-box" class="status-box status-info">Loading donation totals…</div>

  <div id="content" style="display:none">
    <div class="card">
      <div class="stat-card">
        <div class="stat-total" id="stat-total">0<span class="unit">ALGO</span></div>
        <div class="stat-sub" id="stat-sub">from 0 donations</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Individual Donations</span>
        <button class="refresh-btn" id="refresh-btn" onclick="loadDonations()">↻ Refresh</button>
      </div>
      <div class="list" id="donation-list"></div>
    </div>
  </div>

  <a class="back-link" href="donate.html">← Back to donate page</a>
</div>

<script>
  // ── Configuration — must match donate.html ────────────────────────────
  const RECEIVER_ADDRESS = 'INI2O6GB3LIVOKXE7SJ6ASHPHEBPXJKAXOKV23MIZYKMK3POTHE6LDZ4SY';
  const DONATION_NOTE    = 'Donation to Mr. Golem - Thank you for your support!';
  const INDEXER_URL      = 'https://mainnet-idx.algonode.cloud';
  // ─────────────────────────────────────────────────────────────────────

  function base64FromString(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function formatAmount(n) {
    // trims trailing zeros, keeps up to 6 decimal places, adds thousands separators
    const rounded = Math.round(n * 1e6) / 1e6;
    return rounded.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }
  function timeAgo(ms) {
    if (!ms) return '';
    const diff = Math.max(0, Date.now() - ms);
    const mins = Math.floor(diff / 60000);
    if (mins < 1)   return 'just now';
    if (mins < 60)  return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24)   return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 30)  return days + 'd ago';
    const months = Math.floor(days / 30);
    if (months < 12) return months + 'mo ago';
    return Math.floor(months / 12) + 'y ago';
  }
  function showStatus(type, msg) {
    const el = document.getElementById('status-box');
    el.className     = 'status-box status-' + type;
    el.innerHTML     = msg;
    el.style.display = 'block';
  }

  async function fetchAllDonations() {
    const donations   = [];
    const notePrefix  = encodeURIComponent(base64FromString(DONATION_NOTE));
    let nextToken     = null;
    do {
      let url = `${INDEXER_URL}/v2/accounts/${RECEIVER_ADDRESS}/transactions`
        + `?tx-type=pay&note-prefix=${notePrefix}&limit=100`;
      if (nextToken) url += `&next=${encodeURIComponent(nextToken)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Indexer request failed (' + res.status + ')');
      const data  = await res.json();
      const txns  = data.transactions || [];
      txns.forEach(function(t) {
        const p = t['payment-transaction'];
        if (p && p.receiver === RECEIVER_ADDRESS && !t['sender-rewards'] && p.amount > 0) {
          donations.push({
            amount: p.amount / 1_000_000,
            time:   t['round-time'] ? t['round-time'] * 1000 : null,
            id:     t.id,
          });
        }
      });
      nextToken = data['next-token'] || null;
    } while (nextToken);
    donations.sort(function(a, b) { return (b.time || 0) - (a.time || 0); });
    return donations;
  }

  async function loadDonations() {
    const refreshBtn = document.getElementById('refresh-btn');
    if (refreshBtn) refreshBtn.disabled = true;
    showStatus('info', 'Loading donation totals…');
    try {
      const donations = await fetchAllDonations();
      const total = donations.reduce(function(sum, d) { return sum + d.amount; }, 0);

      document.getElementById('stat-total').innerHTML =
        formatAmount(total) + '<span class="unit">ALGO</span>';
      document.getElementById('stat-sub').textContent =
        'from ' + donations.length + (donations.length === 1 ? ' donation' : ' donations');

      const listEl = document.getElementById('donation-list');
      if (donations.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No donations yet — be the first to support Mr. Golem!</div>';
      } else {
        listEl.innerHTML = donations.map(function(d) {
          return '<div class="donation-row">'
            + '<span class="amount">' + formatAmount(d.amount) + '<span class="unit">ALGO</span></span>'
            + '<span class="time">' + timeAgo(d.time) + '</span>'
            + '</div>';
        }).join('');
      }

      document.getElementById('status-box').style.display = 'none';
      document.getElementById('content').style.display    = 'block';
    } catch (err) {
      showStatus('error', '⚠️ Could not load donation data: ' + err.message + '.<br>Please try refreshing.');
    } finally {
      if (refreshBtn) refreshBtn.disabled = false;
    }
  }

  loadDonations();
</script>
</body>
</html>
